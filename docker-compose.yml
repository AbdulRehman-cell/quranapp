version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: quranapp:1.0.0
    container_name: quranapp
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      NODE_ENV: production
      PORT: 10000
      MONGO_URI: mongodb://mongo:27017/quranapp
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:10000}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - quranapp-net

  mongo:
    image: mongo:7.0.12
    container_name: quranapp-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: quranapp
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quranapp-net

volumes:
  mongo-data:
    driver: local

networks:
  quranapp-net:
    driver: bridge